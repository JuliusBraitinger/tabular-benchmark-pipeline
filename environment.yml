name: tcml
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - numpy>=1.24
  - pandas>=2.0
  - scikit-learn>=1.3
  - requests>=2.31
  - plotly>=5.0
  - bioconductor-curatedmetagenomicdata  # microbiome datasets (R); see scripts/export_cmd.R
  - r-dplyr                               # used by scripts/export_cmd.R
  - pip
  - pip:
      - openml>=0.14
      - GEOparse>=2.0
      - biopython>=1.81
      - ucimlrepo>=0.0.7
      - kaggle>=1.6
      - tabpfn>=0.1.0
